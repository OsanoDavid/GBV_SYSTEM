{% extends 'base.html' %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center px-4 py-12 bg-white">
    <div class="max-w-md w-full bg-white border border-gray-100 p-8 rounded-3xl shadow-[0_20px_60px_rgba(109,40,217,0.08)]">
        <h1 class="text-2xl font-black text-gray-900">Choose a new password</h1>
        <p class="text-sm text-gray-500 mt-2">Enter a secure password and confirm it below.</p>

        <form method="post" class="space-y-5 mt-6">
            {% csrf_token %}
            {{ form.new_password1.label_tag }}
            {{ form.new_password1 }}
            {{ form.new_password2.label_tag }}
            {{ form.new_password2 }}
            <button type="submit" class="w-full bg-violet-600 hover:bg-violet-700 text-white uppercase tracking-widest text-xs font-bold py-3 rounded-xl">Reset password</button>
        </form>
    </div>
</div>
{% endblock %}
