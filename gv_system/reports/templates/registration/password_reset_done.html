{% extends 'base.html' %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center px-4 py-12 bg-white">
    <div class="max-w-md w-full bg-white border border-gray-100 p-8 rounded-3xl shadow-[0_20px_60px_rgba(109,40,217,0.08)]">
        <h1 class="text-2xl font-black text-gray-900">Check your inbox</h1>
        <p class="text-sm text-gray-500 mt-2">We have sent password reset instructions to the email address provided, if it exists in our system.</p>
        <div class="mt-6 text-center text-xs text-gray-500">
            <a href="{% url 'login' %}" class="font-semibold text-violet-700 hover:text-violet-900">Return to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
