{% extends 'base.html' %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center px-4 py-12 bg-gradient-to-br from-fuchsia-50 via-white to-purple-50">
    <div class="w-full max-w-lg bg-white/95 border border-purple-100 rounded-[2rem] shadow-2xl p-10 text-center">
        <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-violet-100 text-violet-700 text-3xl">
            <i class="fas fa-check"></i>
        </div>
        <h1 class="text-4xl font-black text-purple-950">Sent successfully!</h1>
        <p class="mt-4 text-sm text-gray-600 leading-relaxed">If the email address exists in our system, you will receive a password reset link shortly. Please check your inbox and spam folder.</p>
        <div class="mt-8 flex flex-col gap-3 sm:flex-row justify-center">
            <a href="{% url 'login' %}" class="inline-flex items-center justify-center rounded-full border border-violet-200 bg-white px-5 py-3 text-sm font-semibold text-violet-700 transition hover:bg-violet-50">Return to login</a>
            <a href="{% url 'landing' %}" class="inline-flex items-center justify-center rounded-full bg-violet-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-violet-700">Back to home</a>
        </div>
    </div>
</div>
{% endblock %}
