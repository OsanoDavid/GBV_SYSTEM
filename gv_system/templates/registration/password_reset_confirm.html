{% extends 'base.html' %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center px-4 py-12 bg-gradient-to-br from-violet-50 via-white to-purple-50">
    <div class="w-full max-w-xl bg-white/95 border border-purple-100 rounded-[2rem] shadow-2xl p-8">
        <div class="text-center space-y-4">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-violet-100 text-violet-700">
                <i class="fas fa-lock text-xl"></i>
            </div>
            <h1 class="text-3xl font-black text-purple-950">Choose a new password</h1>
            <p class="text-sm text-gray-600 max-w-lg mx-auto">Enter your new password twice to keep your account secure.</p>
        </div>

        <form method="post" class="mt-8 space-y-5">
            {% csrf_token %}
            <div>
                {{ form.new_password1.label_tag }}
                {{ form.new_password1 }}
            </div>
            <div>
                {{ form.new_password2.label_tag }}
                {{ form.new_password2 }}
            </div>
            <button type="submit" class="w-full rounded-3xl bg-violet-600 px-5 py-3 text-sm font-semibold uppercase tracking-[0.12em] text-white transition hover:bg-violet-700">Reset password</button>
        </form>
    </div>
</div>
{% endblock %}
